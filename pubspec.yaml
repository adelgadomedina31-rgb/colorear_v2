name: colorear_ninos
description: ARVI - app para colorear sin anuncios y sin internet, pensada para una niña de 3 años.
publish_to: 'none'
version: 12.0.0+12

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_drawing: ^1.0.1
  shared_preferences: ^2.2.3
  # Para guardar lo pintado en el celular
  path_provider: ^2.1.5
  # Voz que dice el nombre de los colores (usa la voz del propio celular)
  flutter_tts: ^4.2.0
  # Sonidos al pintar, la fiesta al terminar y las voces grabadas
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/drawings/
    # Sonidos: cada grupo en su carpeta (ver assets/sonidos/LEEME.txt).
    # Si agregas una carpeta nueva de sonidos, agrégala también aquí.
    - assets/sonidos/comunes/
    - assets/sonidos/pintar/
    - assets/sonidos/colores/
    - assets/sonidos/animales/
    - assets/sonidos/burbujas/
    - assets/sonidos/contar/
    - assets/voces/

# La versión 2.5 de esta librería (octubre 2026) falla en el APK
# ("NoSuchMethodError" al abrir Pintar): se usa la anterior.
dependency_overrides:
  shared_preferences_android: 2.4.28
